name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --target run-test

      - name: Run tests
        run: ./build/test/run-test

  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: clang-format-18 --dry-run --Werror src/*.c include/*.h test/*.cpp test/*.h

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # constParameterPointer is suppressed: it would have cppcheck suggest
      # `const` on every getter's self pointer, which is a wider API-style
      # change than a static-analysis job should make on its own.
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability,style \
            --error-exitcode=1 --suppress=constParameterPointer \
            -Iinclude src/
